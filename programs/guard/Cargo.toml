[package]
name = "guard"
version = "0.1.0"
description = "xARGOS guard: snapshot and assert_min_delta"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.0.1"
anchor-spl = { version = "1.0.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
